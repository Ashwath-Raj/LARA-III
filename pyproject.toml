[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-agent-local-core"
version = "0.2.0"
description = "Local-first Ubuntu Agent task core and optional inference adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Pin the provider SDK so the optional hosted adapter is reproducible while
# leaving SQLite, local Ollama HTTP, tasks, and reminders dependency-free.
gemini = ["google-genai==2.25.0"]
rag = ["qdrant-client==1.14.3"]

[tool.setuptools.packages.find]
include = ["ubuntu_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
